# Nginx 三件套: SSE / 上传 / 字体
# 贴到 /etc/nginx/conf.d/gzm-design.conf

upstream orch { least_conn; server 127.0.0.1:8000 max_fails=3 fail_timeout=15s; }
upstream rend { server 127.0.0.1:3001; }

limit_req_zone $binary_remote_addr zone=api_qps:10m rate=10r/s;

server {
    listen 443 ssl http2;
    server_name design.yourshop.com;
    root /var/www/gzm/dist;
    ssl_certificate     /etc/nginx/ssl/design.yourshop.com.crt;
    ssl_certificate_key /etc/nginx/ssl/design.yourshop.com.key;

    # ① SPA fallback
    location / { try_files $uri $uri/ /index.html; }

    # ② SSE: one line can't be missing
    location /api/jobs/ {
        proxy_pass http://orch;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Last-Event-ID $http_last_event_id;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 5s;
        add_header Cache-Control "no-cache, no-transform" always;
        add_header X-Accel-Buffering "no" always;
        add_header Content-Type "text/event-stream; charset=utf-8" always;
    }

    # ③ regular API + large upload
    location /api/ {
        proxy_pass http://orch;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32m;
        client_body_buffer_size 2m;
        proxy_request_buffering off;
        proxy_read_timeout 130s;
        limit_req zone=api_qps burst=20 nodelay;
    }
    location /api/v1/render/ { proxy_pass http://rend; proxy_read_timeout 60s; }

    # ④ fonts
    location ~* \.(woff2|woff|ttf|otf)$ {
        types { } default_type font/woff2;
        add_header Access-Control-Allow-Origin "https://design.yourshop.com" always;
        add_header Access-Control-Allow-Headers "Origin, Range" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        gzip off;
    }

    # ⑤ CDN backsource (final/raw read-only)
    location /img/ {
        proxy_pass http://cos-backend;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Content-Disposition "inline";
    }
}
